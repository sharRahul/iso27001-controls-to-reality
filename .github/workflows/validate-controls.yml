name: "Validate ISO 27001 Control Mapping Matrix"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate CSV headers
        run: |
          EXPECTED_HEADERS="Control_ID,Control_Name,Annex_A_Domain,Technology_Area,Control_Owner_Role,Implementation_Status,Technical_Implementation_Notes,Evidence_Type,Evidence_Naming_Example,ISO_Clause_Reference,Last_Reviewed_Date,NIST_CSF_2_Mapping,Cyber_Essentials_Mapping,Notes"
          ACTUAL_HEADERS=$(python3 -c "
          import sys, csv
          with open('docs/control-mapping-matrix.csv', newline='', encoding='utf-8') as f:
              reader = csv.reader(f)
              headers = next(reader)
          print(','.join(headers))
          ")
          if [ "$ACTUAL_HEADERS" != "$EXPECTED_HEADERS" ]; then
            echo "ERROR: CSV headers do not match the expected schema."
            echo "Expected: $EXPECTED_HEADERS"
            echo "Actual:   $ACTUAL_HEADERS"
            exit 1
          fi
          echo "SUCCESS: CSV headers are valid."

      - name: Validate Implementation_Status values
        run: |
          python3 -c "
          import sys, csv

          valid_statuses = {
              'Not Started', 'Designed', 'Implemented', 'Evidenced', 'Reviewed', 'Exception'
          }
          errors = []

          with open('docs/control-mapping-matrix.csv', newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              for row_num, row in enumerate(reader, start=2):
                  status = row.get('Implementation_Status', '').strip()
                  if status not in valid_statuses:
                      errors.append(f'Row {row_num}: Invalid Implementation_Status \"{status}\" — full row: {dict(row)}')

          if errors:
              print('ERROR: Invalid Implementation_Status values found:')
              for err in errors:
                  print(err)
              sys.exit(1)

          print(f'SUCCESS: All rows have valid Implementation_Status values.')
          "

      - name: Check for duplicate Control_IDs
        run: |
          python3 -c "
          import sys, csv
          from collections import Counter

          control_ids = []
          with open('docs/control-mapping-matrix.csv', newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  control_id = row.get('Control_ID', '').strip()
                  if control_id:
                      control_ids.append(control_id)

          counts = Counter(control_ids)
          duplicates = [cid for cid, count in counts.items() if count > 1]

          if duplicates:
              print('ERROR: Duplicate Control_ID values found:')
              for dup in duplicates:
                  print(f'  {dup} (appears {counts[dup]} times)')
              sys.exit(1)

          print(f'SUCCESS: No duplicate Control_IDs found. Total rows checked: {len(control_ids)}.')
          "

      - name: Output control count summary
        run: |
          python3 -c "
          import sys, csv, os
          from collections import Counter

          rows = []
          with open('docs/control-mapping-matrix.csv', newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  rows.append(row)

          status_counts = Counter(row.get('Implementation_Status', '').strip() for row in rows)
          area_counts = Counter(row.get('Technology_Area', '').strip() for row in rows)

          summary_lines = []
          summary_lines.append('## ISO 27001 Control Mapping Matrix — Validation Summary')
          summary_lines.append('')
          summary_lines.append(f'**Total controls:** {len(rows)}')
          summary_lines.append('')
          summary_lines.append('### Controls by Implementation Status')
          summary_lines.append('')
          summary_lines.append('| Implementation Status | Count |')
          summary_lines.append('|-----------------------|-------|')
          for status in ['Not Started', 'Designed', 'Implemented', 'Evidenced', 'Reviewed', 'Exception']:
              count = status_counts.get(status, 0)
              summary_lines.append(f'| {status} | {count} |')

          summary_lines.append('')
          summary_lines.append('### Controls by Technology Area')
          summary_lines.append('')
          summary_lines.append('| Technology Area | Count |')
          summary_lines.append('|-----------------|-------|')
          for area, count in sorted(area_counts.items()):
              summary_lines.append(f'| {area} | {count} |')

          summary = '\n'.join(summary_lines)

          print(summary)

          step_summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary_path:
              with open(step_summary_path, 'a', encoding='utf-8') as f:
                  f.write(summary + '\n')
          "
