name: Validate control data and build dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate CSV schema and dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository data
        run: python scripts/validate_repository.py --dashboard-dir build/control-dashboard

      - name: Publish dashboard to job summary
        run: cat build/control-dashboard/control-status-dashboard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-status-dashboard
          path: build/control-dashboard/
          if-no-files-found: error
